name: Deploy

# Runs terraform plan + apply for the target environment.
#
# Triggers:
#   - workflow_dispatch -> manually deploys to the selected environment
#
# Promotion path: dev (manual) -> staging (manual) -> prod (manual + approval)
#
# GitHub Environment protection rules enforce the gates:
#   dev     - manual trigger after CI passes
#   staging - required reviewers before the job runs
#   prod    - required reviewers + deployment protection rules
#
# AWS authentication uses OIDC (no long-lived access keys stored anywhere).
# Each environment has a dedicated IAM role: edp-{env}-github-actions-role
#
# Required GitHub configuration:
#   Environment variables (Settings -> Environments -> {env} -> Variables):
#     AWS_ACCOUNT_ID - the 12-digit AWS account ID
#   Environment secrets (Settings -> Environments -> {env} -> Secrets):
#     TF_VAR_DB_PASSWORD             - RDS master password
#     TF_VAR_REDSHIFT_ADMIN_PASSWORD - Redshift admin password
#
# Optional variables (omit to skip the SNS email subscription):
#   TF_VAR_alert_email - set inline below or via TF_VAR_ALERT_EMAIL env var

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      enable_serving:
        description: "Create Redshift Serverless serving layer"
        required: true
        default: false
        type: boolean

# One deploy per environment at a time. If someone starts another deploy while
# one is running, GitHub cancels the in-progress run. Terraform catches SIGTERM
# and releases the state lock before the runner exits, preventing stale locks.
concurrency:
  group: terraform-deploy-${{ github.ref_name }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    env:
      TF_ENV: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: environments/${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Mask AWS account ID in logs
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials (OIDC)
        env:
          ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.TF_ENV }}-github-actions-role
          AWS_REGION_VALUE: eu-central-1
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: terraform init
        run: terraform init -backend-config="profile=" -reconfigure

      - name: terraform plan
        id: plan
        # -detailed-exitcode: 0=no changes, 1=error, 2=changes present.
        # continue-on-error so exit code 2 doesn't fail the step before we
        # capture it. The "Fail on plan error" step below re-raises code 1.
        continue-on-error: true
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -input=false -out=tfplan > /tmp/plan.txt 2>&1
          PLAN_STATUS=$?
          set -e
          echo "exit_code=${PLAN_STATUS}" >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_redshift_admin_password: ${{ secrets.TF_VAR_REDSHIFT_ADMIN_PASSWORD }}
          TF_VAR_claude_provider: ${{ vars.CLAUDE_PROVIDER || 'aws_claude_platform' }}
          TF_VAR_enable_serving: ${{ inputs.enable_serving }}
          TF_VAR_profile: ""
          # TF_VAR_alert_email is optional. When not set, the SNS topic is
          # created but no email subscriber is added. Set TF_VAR_ALERT_EMAIL
          # as an environment variable in GitHub Settings to enable alerts.

      - name: Write plan to job summary
        working-directory: ${{ github.workspace }}
        run: |
          echo "### Terraform Plan (${{ env.TF_ENV }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*(#\s+\w|Plan:|No changes|will be|Error|Warning)' /tmp/plan.txt \
            | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Resource names shown. Attribute values omitted. Full plan in workflow logs._" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "Terraform plan failed. See plan output above."
          exit 1

      - name: No changes — skipping apply
        if: steps.plan.outputs.exit_code == '0'
        run: echo "Plan shows no infrastructure changes. Apply skipped."

      - name: terraform apply
        if: steps.plan.outputs.exit_code == '2'
        run: |
          set +e
          terraform apply -auto-approve -input=false -no-color tfplan > /tmp/apply.txt 2>&1
          APPLY_STATUS=$?
          set -e
          if [ "${APPLY_STATUS}" -ne 0 ]; then
            echo "Terraform apply failed. Filtered diagnostics:"
            grep -E '^\s*(Error:|Warning:|Plan:|Apply complete|No changes|#\s+\w|  #)' /tmp/apply.txt | head -120 || true
            exit "${APPLY_STATUS}"
          fi
          grep -E '^\s*(Apply complete|No changes|Plan:)' /tmp/apply.txt | head -40 || true

      - name: Deployment summary
        if: steps.plan.outputs.exit_code == '2'
        working-directory: ${{ github.workspace }}
        run: |
          echo ""
          echo "Terraform apply complete: edp-${{ env.TF_ENV }}"
          echo "Environment: ${{ env.TF_ENV }}"
          echo "Commit: ${{ github.sha }}"
